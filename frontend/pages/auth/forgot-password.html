<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | QuickBite</title>
  <link rel="stylesheet" href="C:\xampp\htdocs\Quickbite-Food-Delivery\frontend\assets\css\base.css">
  <link rel="stylesheet" href="C:\xampp\htdocs\Quickbite-Food-Delivery\frontend\assets\css\pages\forgot-password.css">
</head>
<body>

  <div class="page">
    <aside class="brand-panel">
      <div class="brand-name">QuickBite</div>
      <h2 class="brand-title">Food ordering and delivery management made simple.</h2>
      <p class="brand-text">One platform for customers, restaurants, riders and administrators.</p>
    </aside>
    <main class="form-area">
      <div class="form-card">
        <h1>Forgot your password?</h1>
        <p class="subtitle">Enter your account email and QuickBite will send a reset link.</p>

        <div id="messageBox" class="message-box hidden"></div>

        <form id="forgotForm" novalidate>
          <div class="field" id="emailField">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@gmail.com">
          </div>
          <p class="error-text" id="emailError"></p>

          <button type="submit" id="sendBtn" class="btn-primary">Send reset link</button>
        </form>

        <a href="login.html" class="btn-secondary">Back to login</a>
      </div>
    </main>

  </div>

  <script src="C:\xampp\htdocs\Quickbite-Food-Delivery\frontend\assets\js\pages\forgot-password.js"></script>
</body>
</html>
