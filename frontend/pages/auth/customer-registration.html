<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite | Create Account</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  
  <link rel="stylesheet" href="../../assets/css/pages/customer-registration.css">
</head>
<body>

  <div class="page">

    <div class="brand-panel">
      <div class="brand-content">
        <h1 class="brand-name">QuickBite</h1>
        <h2 class="brand-heading">Food ordering and delivery management made simple.</h2>
        <p class="brand-text">One platform for customers, restaurants, riders and your business.</p>
      </div>
    </div>

    <div class="form-panel">
      <div class="login-card">

        <h2 class="card-title">Create customer account</h2>
        <p class="card-subtitle">Register to create an account and place orders.</p>

        <p class="form-error-message" id="formError"></p>

        <form id="signupForm" action="#" method="post" novalidate>

          <div class="form-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required>
            <span class="field-error" id="fullNameError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" required>
            <span class="field-error" id="phoneError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
            <span class="field-error" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="btn-login" id="signupBtn">Create Account</button>

        </form>

        <p class="form-footer-text">
          Already have an account? <a href="../../pages/auth/login.html" class="link-inline">Log in</a>
        </p>

      </div>
    </div>

  </div>

  <script src="../../assets/js/pages/customer-registration.js"></script>

</body>
</html>
